<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outpost — Authentic Travel Journal &amp; Expedition Planner</title>
  <meta name="description" content="Plan travel details, day-by-day itineraries, group expense splitting, and packing checklists with Outpost." />

  <!-- Google Fonts: Fraunces, Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..800&family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />

  <!-- Leaflet CSS & JS CDN (Interactive Map) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Chart.js CDN (Expense Analytics) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Application Stylesheet -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-container">
    <!-- Navbar Header -->
    <header class="navbar">
      <div class="nav-brand" title="Return to Outpost Dashboard" id="nav-brand-logo">
        <div class="brand-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E06D53" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
        </div>
        <span class="outpost-brand-title">Outpost</span>
      </div>

      <div class="nav-actions-wrap" style="display: flex; align-items: center; gap: 0.75rem;">
        <!-- Element 1: Profile Avatar Pill Button -->
        <button class="nav-profile-btn" id="nav-profile-trigger" title="Personal Space &amp; Travel Preferences">
          <div class="nav-duo-avatars" id="nav-duo-avatars-wrap">
            <div class="profile-avatar-sm" id="nav-user-avatar">AR</div>
          </div>
          <span class="profile-name-nav" id="nav-user-name">Alex &amp; Taylor</span>
        </button>

        <!-- Element 2: Minimalist Dark/Light Mode Icon Button -->
        <button id="theme-toggle-btn" class="btn btn-icon-only btn-secondary" title="Toggle Theme (Dark/Light)" aria-label="Toggle Theme">
          <!-- Icon rendered dynamically via JS -->
        </button>
      </div>
    </header>

    <!-- Main Dynamic View Container -->
    <main class="main-content" id="app-main">
      <!-- Views (Dashboard, Trip Detail, or Personal Space) render dynamically here -->
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>© 2026 <strong>Outpost</strong> — Crafted for authentic travel journals and expedition planning.</p>
      <div>
        <a href="#" id="footer-settings-btn" style="color: var(--accent-primary); font-weight: 600;">⚙️ Cloud Database Settings</a>
      </div>
    </footer>
  </div>


  <!-- Application Script Bundle -->
  <script src="js/app.js"></script>
</body>
</html>
