<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WanderPulse — Modern Travel Planner & Itinerary Manager</title>
  <meta name="description" content="Plan travel details, day-by-day itineraries, group expense splitting, and packing checklists with WanderPulse." />

  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Leaflet CSS & JS CDN (Interactive Map) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Chart.js CDN (Expense Analytics) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Application Stylesheet -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-container">
    <!-- Navbar Header -->
    <header class="navbar">
      <div class="nav-brand" title="Return to Dashboard">
        <div class="brand-icon">
          <i data-lucide="plane"></i>
        </div>
        <span>Wander<span class="gradient-text">Pulse</span></span>
      </div>

      <div class="nav-actions">
        <button id="theme-toggle-btn" class="btn btn-icon-only btn-secondary" title="Toggle Theme (Dark/Light)">
          <i data-lucide="moon"></i>
        </button>
      </div>
    </header>

    <!-- Main Dynamic View Container -->
    <main class="main-content" id="app-main">
      <!-- Views (Dashboard or Trip Detail) will render dynamically here -->
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>© 2026 <strong>WanderPulse</strong> — Crafted for effortless travel planning. Vercel & GitHub ready.</p>
    </footer>
  </div>

  <!-- Main Application Script (ES Module) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
